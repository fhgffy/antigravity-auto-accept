# 2026-10-22：生产CI与手动完整验收共用原两引擎和打包步骤；本文件不含发布、凭据或并发取消。
# 2026-10-25：删除手动ETW采集，保留全部普通步骤、故障回执、期限和断言。
name: Windows validation core

on:
  workflow_call:
    inputs:
      artifact_suffix:
        description: 'Optional sample suffix; empty preserves the normal release artifact name'
        type: string
        default: ''
      # 2026-10-22：显式布尔选择只映射两个托管标签，禁止任意runner字符串；步骤与期限不变。
      windows_2022:
        type: boolean
        # 2026-10-23：旧调用者同样默认使用已对照的2022，不预读系统文件或放宽任何检查。
        default: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.label }})
    runs-on: ${{ inputs.windows_2022 && 'windows-2022' || 'windows-latest' }}
    timeout-minutes: 15
    # 2026-10-07：作业默认值支持矩阵上下文，步骤 shell 字段不能直接使用矩阵表达式。
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows PowerShell 5.1
            shell: powershell
            executable: powershell.exe
            major: 5
          - label: PowerShell 7
            shell: pwsh
            executable: pwsh.exe
            major: 7
    steps:
      # 2026-10-07：采用官方 Node 24 运行时 Actions，测试项目仍使用 Node 22。
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Verify selected engine
        run: |
          if ($PSVersionTable.PSVersion.Major -ne ${{ matrix.major }}) { throw 'Unexpected PowerShell engine' }
          Write-Output "PowerShell=$($PSVersionTable.PSVersion) edition=$($PSVersionTable.PSEdition)"
      - name: Install locked dependencies
        run: npm ci
      - name: Compile and typecheck
        run: |
          npm run compile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run typecheck
      - name: Validate repository and extension lifecycle
        run: |
          npm run test:repository
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:lifecycle
      # 2026-10-07：执行真实发布脚本的离线边界回归，PR 不联网或使用发布凭据。
      - name: Offline release and store publication regression
        run: node --test tests/publish-release.test.cjs
      # 2026-10-22：取证EXE事先按原十五秒编译上限准备，原自测十五秒与取证五秒均不增加。
      - name: Prepare bounded dump collector
        run: |
          $prepared = node tests/prepare-dump-collector.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $collector = $prepared | ConvertFrom-Json
          [IO.File]::AppendAllText($env:GITHUB_ENV, ('AAA_TEST_DUMP_COLLECTOR=' + $collector.path + [Environment]::NewLine), [Text.UTF8Encoding]::new($false))
      - name: Scanner regression on one engine
        run: |
          $path = [IO.Path]::GetFullPath((Join-Path $PWD 'tests/scanner.test.ps1'))
          $tokens = $null
          $parseErrors = $null
          $testAst = [Management.Automation.Language.Parser]::ParseInput([IO.File]::ReadAllText($path, [Text.Encoding]::UTF8), $path, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw 'Scanner test parse errors' }
          & ($testAst.GetScriptBlock()) -PowerShellEngines @('${{ matrix.executable }}') -TimeoutCollectorPath $env:AAA_TEST_DUMP_COLLECTOR
      # 2026-10-16：先注入真实四十五秒停滞，验证失败诊断和回收；成功标记不能使超时变绿。
      - name: Host wrapper timeout diagnostics and failure boundaries
        env:
          HOST_WRAPPER_ENGINE: ${{ matrix.executable }}
        run: npm run test:host-wrapper
      # 2026-10-07：实际查询自有跨位数进程路径，退出、权限及缓冲边界只替原生依赖。
      - name: Host process identity across architectures
        run: |
          $path = [IO.Path]::GetFullPath((Join-Path $PWD 'tests/host-process.test.ps1'))
          $tokens = $null
          $parseErrors = $null
          $testAst = [Management.Automation.Language.Parser]::ParseInput([IO.File]::ReadAllText($path, [Text.Encoding]::UTF8), $path, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw 'Host process test parse errors' }
          $hostEngines = @('${{ matrix.executable }}')
          if ($PSVersionTable.PSVersion.Major -eq 5) {
            $hostEngines += Join-Path $env:WINDIR 'SysWOW64/WindowsPowerShell/v1.0/powershell.exe'
          }
          & ($testAst.GetScriptBlock()) -PowerShellEngines $hostEngines
      # 2026-10-07：直接回放生产物理方法，系统输入边界用内存替身，CI 不点击桌面。
      - name: Mouse input interference without desktop clicks
        run: |
          $path = [IO.Path]::GetFullPath((Join-Path $PWD 'tests/mouse-helper.test.ps1'))
          $tokens = $null
          $parseErrors = $null
          $testAst = [Management.Automation.Language.Parser]::ParseInput([IO.File]::ReadAllText($path, [Text.Encoding]::UTF8), $path, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw 'Mouse helper test parse errors' }
          # 2026-10-07：PS5 作业同时验证 x86 原生 INPUT 布局，不能用 x64 结构大小替代。
          $mouseEngines = @('${{ matrix.executable }}')
          if ($PSVersionTable.PSVersion.Major -eq 5) {
            $mouseEngines += Join-Path $env:WINDIR 'SysWOW64/WindowsPowerShell/v1.0/powershell.exe'
          }
          & ($testAst.GetScriptBlock()) -PowerShellEngines $mouseEngines
      - name: Concurrent scanner handoff without desktop clicks
        run: |
          $path = [IO.Path]::GetFullPath((Join-Path $PWD 'tests/scanner-concurrency.test.ps1'))
          $tokens = $null
          $parseErrors = $null
          $testAst = [Management.Automation.Language.Parser]::ParseInput([IO.File]::ReadAllText($path, [Text.Encoding]::UTF8), $path, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw 'Concurrency test parse errors' }
          & ($testAst.GetScriptBlock()) -PowerShellEngines @('${{ matrix.executable }}')

      # 2026-10-23：真实暂存控制在原生命周期及全部进程测试之后执行，不改变原首次冷启动的环境。
      - name: Owned timeout diagnostics staging regression
        run: npm run test:timeout-diagnostics

      # 2026-10-23：托管自测子环境用纯Node回调控制，放在全部原进程回归之后，避免预热首个WinPS。
      - name: Hosted lifecycle child environment boundaries
        run: npm run test:lifecycle-env

      # 2026-10-24：新默认x86宿主复用完整扫描回归，只在原测试尾部追加，不预热首次生命周期自测。
      - name: X86 scanner regression on the default host
        if: matrix.major == 5
        run: |
          $x86Engine = Join-Path $env:SystemRoot 'SysWOW64/WindowsPowerShell/v1.0/powershell.exe'
          $testCommand = @'
          $ErrorActionPreference = 'Stop'
          if ([IntPtr]::Size -ne 4) { throw 'Scanner regression requires a 32-bit host' }
          $x86Engine = Join-Path $env:SystemRoot 'SysWOW64/WindowsPowerShell/v1.0/powershell.exe'
          $path = [IO.Path]::GetFullPath((Join-Path $PWD 'tests/scanner.test.ps1'))
          $tokens = $null
          $parseErrors = $null
          $testAst = [Management.Automation.Language.Parser]::ParseInput([IO.File]::ReadAllText($path, [Text.Encoding]::UTF8), $path, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw 'Scanner test parse errors' }
          & ($testAst.GetScriptBlock()) -PowerShellEngines @($x86Engine) -TimeoutCollectorPath $env:AAA_TEST_DUMP_COLLECTOR
          if (-not $?) { throw 'Scanner regression failed' }
          exit 0
          '@
          & $x86Engine -NoLogo -NoProfile -NonInteractive -Command $testCommand
          exit $LASTEXITCODE

      # 2026-10-24：原双轮互斥接管与退出回归同时覆盖x86；继续使用原脚本的空窗口树及截止时间。
      - name: X86 concurrent scanner handoff without desktop clicks
        if: matrix.major == 5
        run: |
          $x86Engine = Join-Path $env:SystemRoot 'SysWOW64/WindowsPowerShell/v1.0/powershell.exe'
          $path = [IO.Path]::GetFullPath((Join-Path $PWD 'tests/scanner-concurrency.test.ps1'))
          $tokens = $null
          $parseErrors = $null
          $testAst = [Management.Automation.Language.Parser]::ParseInput([IO.File]::ReadAllText($path, [Text.Encoding]::UTF8), $path, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw 'Concurrency test parse errors' }
          & ($testAst.GetScriptBlock()) -PowerShellEngines @($x86Engine)

      # 2026-10-23：先把跨临时根的自有失败目录复制到单个独占上传根，复制失败仍保留原件与可用旁证。
      - name: Stage owned host child timeout diagnostics
        if: failure()
        id: timeout_diagnostics
        run: |
          $path = [IO.Path]::GetFullPath((Join-Path $PWD 'tests/stage-owned-timeout-diagnostics.ps1'))
          $tokens = $null
          $parseErrors = $null
          $stageAst = [Management.Automation.Language.Parser]::ParseInput([IO.File]::ReadAllText($path, [Text.Encoding]::UTF8), $path, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw 'Timeout staging parse errors' }
          & ($stageAst.GetScriptBlock())
      # 2026-10-22：只上传本测试独占前缀的失败子进程二进制与转储，不收集用户进程或整个临时目录。
      - name: Preserve owned host child timeout diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: host-child-timeout-${{ github.run_id }}-${{ matrix.major }}${{ inputs.artifact_suffix }} # 2026-10-22：同次矩阵按样本隔离失败旁证。
          # 2026-10-23：同步自测失败回执覆盖托管临时根与默认临时根，不扩大到其他进程。
          path: ${{ steps.timeout_diagnostics.outputs.path }}
          if-no-files-found: warn
          retention-days: 14
  package:
    name: Verified VSIX
    needs: test
    runs-on: ${{ inputs.windows_2022 && 'windows-2022' || 'windows-latest' }}
    timeout-minutes: 15
    # 2026-10-22：动态runner表达式无法静态推断Windows默认语言；显式保留原pwsh及完整ShellCheck。
    defaults:
      run:
        shell: pwsh
    steps:
      # 2026-10-07：采用官方 Node 24 运行时 Actions，测试项目仍使用 Node 22。
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Package extension
        run: npm run package
      - name: Verify packaged runtime and metadata
        id: vsix
        run: |
          $manifest = Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json
          $vsix = "$($manifest.name)-$($manifest.version).vsix"
          & ./tests/validate-vsix.ps1 -VsixPath $vsix
          $hash = (Get-FileHash -LiteralPath $vsix -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD "$vsix.sha256"), "$hash  $vsix`n", [Text.UTF8Encoding]::new($false))
          "path=$vsix" >> $env:GITHUB_OUTPUT
      - name: Upload verified installable package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: antigravity-auto-accept-${{ github.sha }}${{ inputs.artifact_suffix }} # 2026-10-22：空后缀保持原发布契约。
          path: |
            ${{ steps.vsix.outputs.path }}
            ${{ steps.vsix.outputs.path }}.sha256
          if-no-files-found: error
          retention-days: 14

